ssion:"自信があり、頼りがいのある",desire:"自分の力で物事を成し遂げたいという思い",mission:"先頭に立って新しい流れをつくる",talent:"ゼロから物事を立ち上げる",challenge:"人に頼ることや弱さを見せることへの抵抗",workStyle:"自分で判断できる裁量があるほど集中力が高まり、目標を掲げて一直線に進むスタイルです。",relation:"頼られると力を発揮しますが、相手のペースを尊重することが関係を長続きさせる鍵になります。",later:"自分らしさを確立し、後に続く人の道しるべとなること"}},2:{number:2,title:"調和と協力の数",keyword:"協調・感受性・サポート",basic:"2は「ふたつのものをつなぐ」数とされ、協力・調和・受容を象徴します。人と人の間に立ち、関係を育てるエネルギーを持つ数です。",nature:"相手の気持ちを敏感に感じ取り、場の空気を和らげる優しさを持つ傾向があります。争いを好まず、周囲が心地よくいられるよう自然に気を配れる人と読み取れます。",strengths:["人の気持ちに寄り添える共感力","細やかな気配りと丁寧さ","対立を和らげる調整力","粘り強く支え続ける忍耐力"],weaknesses:["相手に合わせすぎて自分の本音を後回しにしやすい","人の評価や言葉を気にして疲れやすい","決断を先延ばしにしてしまうことがある","傷ついても表に出さず、心に溜め込みやすい"],talents:"聞く力、橋渡しをする力、目立たないところで全体を支える力に恵まれやすい数です。",work:"チームの中で人と人をつなぐ役割や、相手を支える仕事で信頼を得やすいでしょう。激しい競争や数字だけで評価される環境では、消耗しやすいかもしれません。",workExamples:["カウンセラー・セラピスト","秘書・アシスタント・事務","看護・保育・介護","調整役・コーディネーター"],love:"相手を大切にし、深い信頼関係を育てようとするタイプとされます。尽くしすぎて自分をすり減らさないよう、「私はこうしたい」と伝える練習が関係をより対等にしてくれます。",money:"堅実で無駄遣いは少ない傾向があります。ただし人付き合いの出費や頼まれごとを断れず、気づくと負担が増えていることもあるため、自分のための予算を確保すると安心です。",lessons:"他者との調和と同じくらい、自分自身との調和を大切にすること。「断る」「頼む」を素直にできるようになると、優しさがより健やかに生かされるとされます。",luck:["一日の終わりに自分の本音を書き出す","月に一度は自分だけの予定を入れる","感謝を言葉にして伝える"],fragments:{essence:"人との調和の中で力を発揮する",impression:"穏やかで話しかけやすい",desire:"人と心を通わせ、安心できる関係を築きたいという思い",mission:"人と人をつなぎ、場を和ませる",talent:"相手の気持ちを汲み取り、橋渡しをする",challenge:"自分の本音を後回しにしてしまう傾向",workStyle:"信頼できる仲間と協力しながら、丁寧に一つずつ積み上げていくスタイルです。",relation:"相手の気持ちを察する力が高く、深い信頼関係を築ける一方、合わせすぎて疲れないよう自分の時間を確保することが大切です。",later:"支える側から、人と人を結ぶ要としての存在感を育てること"}},3:{number:3,title:"表現と喜びの数",keyword:"創造・表現・楽しさ",basic:"3は「1と2から生まれる新しいもの」を表し、創造性や表現、喜びを象徴するとされます。言葉や作品を通じて世界を明るくするエネルギーの数です。",nature:"明るく好奇心旺盛で、楽しいことや美しいものに心が動きやすいタイプと読み取れます。感じたことを表現したいという気持ちが強く、周囲に笑顔をもたらす存在になりやすいでしょう。",strengths:["場を明るくするユーモアと社交性","言葉や色・形で伝える表現力","柔軟な発想と遊び心","人を楽しませるサービス精神"],weaknesses:["興味が移りやすく、最後までやり遂げる前に飽きることがある","気分の波が行動に出やすい","楽しさを優先して計画や準備が後回しになりがち","本音を冗談でごまかしてしまうことがある"],talents:"話す・書く・描くなど、自分を表現する力や、物事を魅力的に伝える力に恵まれやすい数です。",work:"自分のアイデアやセンスを生かせる仕事、人前に出る仕事で輝きやすいでしょう。単調な繰り返しが続く仕事では、工夫の余地を見つけることがモチベーション維持の鍵になります。",workExamples:["デザイナー・クリエイター","ライター・講師・話す仕事","広報・SNS運用・接客","エンターテインメント関連"],love:"一緒にいて楽しい関係を好み、明るい雰囲気で相手を惹きつけるタイプとされます。深刻な話し合いを避けがちな面があるため、ときには真剣に向き合う時間を持つと絆が深まります。",money:"楽しいことや好きなものへの出費が多くなりやすい傾向があります。「楽しみのためのお金」と「貯めるお金」を最初に分けておくと、気持ちよく使えるでしょう。",lessons:"ひらめきを形にするまで続けること。楽しさと継続のバランスを取ることで、才能が実りとして残りやすくなるとされます。",luck:["思いついたことをメモやSNSに発信する","好きな色や服で気分を上げる","一つの作品を完成まで仕上げてみる"],fragments:{essence:"感じたことを表現し、人生を楽しもうとする",impression:"明るく親しみやすい",desire:"自分らしく表現し、喜びを分かち合いたいという思い",mission:"言葉や創造を通して周囲に明るさを届ける",talent:"物事を魅力的に表現し伝える",challenge:"興味が移りやすく、継続が途切れやすい傾向",workStyle:"アイデアやセンスを形にできる場で意欲が高まり、楽しみながら成果を出すスタイルです。",relation:"明るさで人を惹きつけ、交友関係が広がりやすい一方、本音で語り合える少数の関係を育てることも大切です。",later:"培った感性を作品や言葉として残し、人に喜びを伝えること"}},4:{number:4,title:"安定と基盤の数",keyword:"堅実・誠実・積み重ね",basic:"4は四角形や四季のように「安定した土台」を象徴するとされます。秩序を整え、一歩ずつ確かなものを築くエネルギーの数です。",nature:"真面目で責任感が強く、約束や決まりを大切にするタイプと読み取れます。派手さよりも確実さを重んじ、地道な努力を積み重ねることで信頼を得ていく傾向があります。",strengths:["最後までやり遂げる責任感","計画を立てて着実に進める力","誠実で信頼される人柄","現実的で地に足のついた判断"],weaknesses:["変化や想定外の出来事に戸惑いやすい","自分にも他人にも厳しくなりがち","慎重さが行き過ぎてチャンスを逃すことがある","「こうあるべき」にとらわれ、融通が利きにくい面がある"],talents:"仕組みを整える力、コツコツと継続する力、正確に管理する力に恵まれやすい数です。",work:"ルールや手順が明確で、積み重ねが評価される仕事で力を発揮しやすいでしょう。方針が頻繁に変わる環境では、自分なりの手順を持つことで安定感が保てます。",workExamples:["経理・総務・事務管理","技術職・エンジニア・職人","公務員・金融","建築・不動産・製造"],love:"誠実で、一度決めた相手を大切にし続けるタイプとされます。気持ちを言葉にするのが苦手な面があるため、行動だけでなく言葉で愛情を伝えると相手の安心感が増します。",money:"計画的で貯蓄が得意な傾向があります。守りが強くなりすぎると自己投資や楽しみを我慢しすぎることもあるため、「使うと決めたお金」は気持ちよく使いましょう。",lessons:"安定を守ることと、変化を受け入れることの両立。完璧でなくても前に進める柔軟さを身につけることで、築いたものがより強くなるとされます。",luck:["一週間の予定を整理して可視化する","部屋や机の整理整頓をする","いつもと違う道やお店を試してみる"],fragments:{essence:"着実に積み重ね、確かなものを築こうとする",impression:"真面目で信頼できる",desire:"安心できる土台を築き、守りたいという思い",mission:"秩序を整え、人が安心できる仕組みをつくる",talent:"計画を立てて最後までやり遂げる",challenge:"変化への戸惑いや「こうあるべき」へのこだわり",workStyle:"計画と手順を大切にし、一つひとつ確実に積み上げて信頼を築くスタイルです。",relation:"誠実さで長く続く信頼関係を築きやすく、言葉で気持ちを伝えることを意識すると関係がより温かくなります。",later:"築いてきた経験と仕組みを、次の世代が使える形で残すこと"}},5:{number:5,title:"自由と変化の数",keyword:"自由・冒険・変化",basic:"5は人間の五感や手足の五本指に通じ、体験を通して学ぶことを象徴するとされます。変化と自由を求め、世界を広げていくエネルギーの数です。",nature:"好奇心が強く、新しい体験や刺激を求めるタイプと読み取れます。フットワークが軽く、状況の変化にも素早く適応できる柔軟さを持つ傾向があります。",strengths:["行動力とフットワークの軽さ","変化への適応力","多才で何でも器用にこなす","人を惹きつける話術と魅力"],weaknesses:["飽きっぽく、同じことを続けるのが苦手","束縛を嫌うあまり、責任から距離を置きたくなる","刺激を求めて衝動的に行動することがある","物事を広く浅く扱ってしまいがち"],talents:"情報を集めて伝える力、人と人・場所と場所をつなぐ力、変化を楽しむ力に恵まれやすい数です。",work:"移動や出会いが多い仕事、変化に富んだ仕事で生き生きしやすいでしょう。同じ作業の繰り返しが続く場合は、学びや挑戦の要素を自分で加えると意欲が保てます。",workExamples:["営業・販売・PR","旅行・観光・運輸","メディア・情報発信","複数の仕事を組み合わせる働き方"],love:"刺激と楽しさのある関係を好み、相手にも自由を尊重してほしいタイプとされます。安心感を求める相手には、連絡や約束を丁寧に守ることで信頼が深まります。",money:"入ってくる流れも出ていく流れも大きくなりやすい傾向があります。体験への出費は財産にもなりますが、衝動買いを防ぐ「24時間ルール」が役立ちます。",lessons:"自由と責任のバランスをとること。一つのことを深める経験を通して、本当の意味での自由を手にできるとされます。",luck:["行ったことのない場所に出かける","新しい人と話す機会をつくる","一つの習慣を3か月続けてみる"],fragments:{essence:"自由に動き、体験を通して世界を広げようとする",impression:"活発で話題が豊富な",desire:"縛られず、さまざまな体験をしたいという思い",mission:"新しい風を運び、人や情報をつなぐ",talent:"変化に素早く対応し、新しいことを吸収する",challenge:"飽きっぽさや、責任から逃れたくなる気持ち",workStyle:"変化や出会いがあるほど力を発揮し、複数のことを並行して動かすスタイルです。",relation:"誰とでも打ち解けやすく交友範囲が広い一方、約束を守る丁寧さが深い信頼につながります。",later:"多くの経験を知恵としてまとめ、人に伝えること"}},6:{number:6,title:"愛と奉仕の数",keyword:"愛情・責任・美",basic:"6は調和のとれた六角形のように、愛と美、家族や共同体への責任を象徴するとされます。人を慈しみ、育むエネルギーの数です。",nature:"愛情深く面倒見がよく、困っている人を放っておけないタイプと読み取れます。美しいものや居心地のよい空間を好み、周囲を整えることに喜びを感じる傾向があります。",strengths:["温かく包み込む愛情深さ","責任感と面倒見のよさ","美的センスと空間を整える力","人を育てる力"],weaknesses:["お世話が行き過ぎて干渉になることがある","理想が高く、自分や他人に完璧を求めがち","頼まれると断れず、抱え込みやすい","感謝されないと不満を感じやすい"],talents:"人を育てる力、癒やす力、美しく調和のとれたものをつくる力に恵まれやすい数です。",work:"人の役に立っていると実感できる仕事、美や暮らしに関わる仕事で充実感を得やすいでしょう。役割を抱え込みすぎないよう、任せる範囲を決めておくと長く続けられます。",workExamples:["教育・保育・医療・福祉","美容・インテリア・ファッション","飲食・ホスピタリティ","カウンセリング・ヒーリング"],love:"家族や恋人を大切にし、尽くす愛情表現をするタイプとされます。相手を変えようとするより、ありのままを受け入れる意識を持つと、より穏やかな関係が築けます。",money:"家族や身近な人のために使うことに喜びを感じやすい傾向があります。自分自身への投資やご褒美も「大切な人への贈り物」と同じくらい大切にしましょう。",lessons:"与えることと受け取ることのバランス。自分を大切にすることが、人を大切にする力の源になるとされます。",luck:["花を飾るなど住まいを心地よく整える","自分を労う時間を予定に入れる","「ありがとう」を受け取る練習をする"],fragments:{essence:"愛情を注ぎ、人や場を大切に育もうとする",impression:"温かく面倒見のよい",desire:"愛し愛され、大切な人が幸せでいてほしいという思い",mission:"人を癒やし、育み、心地よい場をつくる",talent:"人を思いやり、育てる",challenge:"抱え込みすぎることや、完璧を求めすぎる傾向",workStyle:"人の役に立つ実感を原動力に、責任をもって丁寧に関わるスタイルです。",relation:"面倒見がよく頼られやすい一方、相手の領域を尊重し、見守る姿勢が関係を健やかに保ちます。",later:"家族や仲間、地域など身近な共同体の支えとなること"}},7:{number:7,title:"探究と内省の数",keyword:"探究・分析・精神性",basic:"7は一週間の七日や虹の七色のように、完成された神秘性を象徴するとされます。物事の本質を見極め、真理を探るエネルギーの数です。",nature:"物事を深く考え、表面だけでは納得しない探究心の持ち主と読み取れます。一人の時間を大切にし、静かな環境で自分の考えを整理することで力を取り戻す傾向があります。",strengths:["鋭い観察力と分析力","一つのことを深く掘り下げる集中力","本質を見抜く直感","流されない独自の視点"],weaknesses:["人に心を開くまで時間がかかる","考えすぎて行動が遅れることがある","自分の基準に合わないものに批判的になりやすい","孤立感を抱えやすい"],talents:"研究・分析する力、専門性を極める力、目に見えないものを感じ取る力に恵まれやすい数です。",work:"専門知識を深められる仕事、一人で集中できる時間がある仕事で力を発揮しやすいでしょう。人前に立つ場面では、事前準備を丁寧にすることで本来の力が出せます。",workExamples:["研究職・専門職・技術者","分析・IT・データ関連","占い・心理・精神世界に関わる仕事","執筆・編集・学術"],love:"心を許した相手とは深く誠実な関係を築くタイプとされます。気持ちを言葉にしないと相手に伝わりにくいため、小さなことでも共有する習慣が距離を縮めてくれます。",money:"衝動的な出費は少なく、知識や本、質の良いものにお金をかける傾向があります。情報を集めすぎて決められない場合は、期限を決めて判断するとよいでしょう。",lessons:"頭で理解することと、心で信頼することの両立。人を信じて委ねる経験を通して、探究の成果を分かち合えるようになるとされます。",luck:["一人で静かに過ごす時間を確保する","学びたい分野の本を一冊読み切る","自然の中を散歩する"],fragments:{essence:"物事の本質を深く探ろうとする",impression:"落ち着いていて知的な",desire:"物事の真理を理解し、納得できる答えを見つけたいという思い",mission:"知識や洞察を深め、物事の本質を示す",talent:"深く観察し分析する",challenge:"心を開くことへのためらいや、考えすぎる傾向",workStyle:"専門性を深め、納得いくまで掘り下げることで質の高い成果を生むスタイルです。",relation:"少数の人と深く関わることを好み、信頼した相手には誠実です。気持ちを言葉にすることが距離を縮める鍵になります。",later:"深めてきた知恵を、静かな説得力をもって人に伝えること"}},8:{number:8,title:"力と実現の数",keyword:"達成・豊かさ・統率",basic:"8は横にすると無限大（∞）の形になり、物質と精神の循環、力と豊かさを象徴するとされます。目標を現実に形にするエネルギーの数です。",nature:"目標達成への意欲が強く、大きなスケールで物事を動かせるタイプと読み取れます。現実的な判断力と粘り強さを併せ持ち、責任ある立場で頼りにされる傾向があります。",strengths:["目標に向かう強い意志と実行力","組織やお金を動かす管理能力","プレッシャーに強い精神力","物事を大きく育てる力"],weaknesses:["成果や地位にこだわりすぎることがある","人に対して支配的・威圧的に映ることがある","仕事を優先して心身や家庭を後回しにしがち","弱音を吐けず、無理を重ねやすい"],talents:"組織をまとめる力、ビジネスの感覚、資源（人・物・お金）を効果的に使う力に恵まれやすい数です。",work:"責任と権限があり、成果が目に見える仕事で力を発揮しやすいでしょう。評価の基準が曖昧な環境では、自分で目標を数値化すると意欲が保てます。",workExamples:["経営者・役員・管理職","金融・不動産・投資","コンサルタント・法律関係","組織運営・事業開発"],love:"頼りがいがあり、相手を守ろうとするタイプとされます。主導権を握りすぎないよう、相手の意見を尊重する姿勢を持つと対等な関係が築けます。",money:"お金を動かす力が強く、稼ぐことにも使うことにも積極的な傾向があります。大きく得る可能性がある分、リスク管理と分散を意識すると安心です。",lessons:"力をどう使うかを学ぶこと。得た豊かさを周囲と分かち合うことで、さらに大きな循環が生まれるとされます。",luck:["目標を数字にして書き出す","身の回りの物の質を一段上げる","得たものの一部を誰かのために使う"],fragments:{essence:"目標を現実のものとして形にしようとする",impression:"堂々として頼りになる",desire:"力を発揮し、目に見える成果や豊かさを手にしたいという思い",mission:"組織や資源を動かし、大きな成果を生み出す",talent:"目標を定めて現実に形にする",challenge:"成果へのこだわりや、無理を重ねてしまう傾向",workStyle:"大きな目標を掲げ、人や資源を動かしながら成果を出していくスタイルです。",relation:"頼りがいがあり人の上に立ちやすい一方、相手の意見を尊重することで信頼がより深まります。",later:"築いた力や豊かさを、人や社会に還元していくこと"}},9:{number:9,title:"完成と博愛の数",keyword:"博愛・理想・完結",basic:"9は1から始まるサイクルの最後の数で、完成・統合・手放しを象徴するとされます。すべての数の性質を内に含み、広い視野で人を思いやるエネルギーの数です。",nature:"視野が広く、立場の違う人の気持ちも理解しようとする寛容さを持つタイプと読み取れます。理想や社会のために何かしたいという気持ちが強く、多くの人を受け入れる懐の深さがあるでしょう。",strengths:["分け隔てない思いやりと寛容さ","広い視野と理解力","芸術的・精神的な感受性","人のために動ける奉仕の心"],weaknesses:["理想と現実のギャップに落ち込みやすい","自分のことを後回しにしすぎる","過去や終わった関係を手放しにくいことがある","何でも受け入れるうちに境界線があいまいになりやすい"],talents:"多様な人を理解し受け入れる力、全体を見渡す力、人の心に届く表現力に恵まれやすい数です。",work:"社会や人の役に立つ実感がある仕事、国際的・芸術的な仕事で充実感を得やすいでしょう。利益だけを追う環境では、自分なりの意義を見つけることが支えになります。",workExamples:["医療・福祉・教育","芸術・文化・表現活動","NPO・国際協力","相談業・スピリチュアル関連"],love:"相手を深く理解し、広い心で受け止めるタイプとされます。相手の理想像を追いかけすぎず、目の前の人を見る意識を持つと、より温かな関係が育ちます。",money:"人のためにお金を使うことに抵抗が少ない傾向があります。寄付や援助は無理のない範囲と決めておくと、自分の生活も守りながら与え続けられます。",lessons:"終わりを受け入れ、手放すこと。一つの章を区切ることで、新しいサイクルが始まるとされます。",luck:["使わないものを手放して空間を整える","ボランティアや人の役に立つ活動に参加する","芸術や音楽に触れる時間をつくる"],fragments:{essence:"広い心で人を受け入れ、理想を追い求める",impression:"包容力があり大人びた",desire:"多くの人の役に立ち、世界をよりよくしたいという思い",mission:"広い視野で人を癒やし、物事を完結へ導く",talent:"多様な人を理解し受け入れる",challenge:"理想と現実の差に悩みやすく、手放すことが難しい傾向",workStyle:"意義や社会への貢献を感じられるほど力が湧き、全体を見渡しながら関わるスタイルです。",relation:"誰に対しても分け隔てなく接することができる一方、自分を守る境界線を持つことで疲れにくくなります。",later:"これまでの経験を統合し、より大きな視点で人に貢献すること"}},11:{number:11,title:"直感と啓示のマスターナンバー",keyword:"直感・インスピレーション・精神性",basic:"11は最初のマスターナンバーで、「1」の意志が二つ並んだ数とされます。直感や霊感、ひらめきを象徴し、目に見えないものと現実をつなぐ橋渡しのエネルギーを持つと考えられています。基数2（協調・感受性）の性質も併せ持ちます。",nature:"感受性が非常に鋭く、言葉にならない空気や人の感情を敏感に察知するタイプと読み取れます。理想が高く、人に気づきや希望を与える役割を担いやすい一方、その繊細さゆえに疲れやすい面もあるでしょう。",strengths:["鋭い直感とひらめき","人の心を動かすカリスマ性","高い理想と精神性","人に気づきを与える力"],weaknesses:["神経が繊細で、ストレスを受けやすい","理想と現実の差に揺れやすい","気分の浮き沈みが大きくなることがある","自分の感覚を疑い、自信を失いやすい"],talents:"インスピレーションを言葉や形にする力、人を励まし導く力、本質を直感的に捉える力に恵まれやすい数です。",work:"人の心や精神に関わる仕事、ひらめきを生かせる仕事で輝きやすいでしょう。刺激が多すぎる環境では消耗しやすいため、静かに整える時間を意識的に持つことが大切です。",workExamples:["カウンセラー・占い師・セラピスト","芸術家・作家・表現者","教育者・講演家","医療・ヒーリング関連"],love:"魂でつながるような深い関係を求めるタイプとされます。相手に理想を重ねすぎず、日常の小さなやりとりを大切にすると関係が安定しやすいでしょう。",money:"お金よりも意義や理想を優先しがちな傾向があります。自分の才能に適切な対価を受け取ることも、活動を続けるための大切な要素です。",lessons:"鋭い感受性を、不安ではなく導きとして使えるようになること。マスターナンバーは負荷も大きいとされ、無理に高い理想を背負わず、基数2の穏やかさで日常を整えることも大切です。",luck:["ひらめきをすぐメモする","瞑想や深呼吸で心を整える","人混みの後は一人で休む時間をとる"],fragments:{essence:"鋭い直感で目に見えないものを感じ取る",impression:"繊細で不思議な魅力のある",desire:"目に見えないものを感じ取り、人に希望を届けたいという思い",mission:"ひらめきや気づきを通して人を励まし導く",talent:"直感的に本質を捉え、言葉や形にする",challenge:"繊細さゆえの疲れやすさと、自分の感覚を疑ってしまう傾向",workStyle:"ひらめきを大切にし、人の心に届く形で表現することで力を発揮するスタイルです。",relation:"相手の気持ちを深く感じ取れる一方、影響を受けすぎないよう心の境界線を意識することが大切です。",later:"自らの感性を信じ、人に気づきや希望を手渡す存在となること"}},22:{number:22,title:"大いなる建設者のマスターナンバー",keyword:"構築・実現・大きな使命",basic:"22は「マスタービルダー」とも呼ばれ、大きな理想を現実の形として築き上げる力を象徴するとされます。11の直感と4の堅実さを併せ持つ数と考えられ、基数4（安定・基盤）の性質も含みます。",nature:"スケールの大きな構想を持ちながら、それを現実に落とし込む実務能力も備えたタイプと読み取れます。社会に残るものを築きたいという思いが強く、責任の大きな役割を担いやすいでしょう。",strengths:["大きな構想を現実にする実行力","組織や仕組みを築く力","現実感覚と理想の両立","長期的な視点"],weaknesses:["期待や責任を背負いすぎ、プレッシャーを感じやすい","完璧主義で自分を追い込みやすい","理想の大きさに対して、今の自分を過小評価しがち","頑固になり、計画の変更を受け入れにくいことがある"],talents:"仕組みや組織を設計する力、長期的な計画を実行する力、人を動かして大きな事業を形にする力に恵まれやすい数です。",work:"社会的な影響の大きい仕事、事業や組織を築く仕事で力を発揮しやすいでしょう。一度にすべてを背負わず、段階的に積み上げる計画を立てることが成功の鍵になります。",workExamples:["経営者・事業家","建築・都市計画・インフラ","組織づくり・制度設計","国際的なプロジェクト"],love:"誠実で、長く続く安定した関係を築こうとするタイプとされます。仕事や使命に没頭しすぎず、大切な人と過ごす時間も計画に組み込むとよいでしょう。",money:"大きなお金を扱う可能性を持つ一方、堅実な管理も得意な傾向があります。長期的な資産形成と、今を楽しむ出費のバランスを意識しましょう。",lessons:"大きな理想に押しつぶされず、一歩ずつ形にしていくこと。基数4の地道さを大切にすることで、マスターナンバーの力が発揮されやすくなるとされます。",luck:["長期目標を小さな段階に分けて書き出す","信頼できる仲間と役割を分担する","休息日をあらかじめ予定に入れる"],fragments:{essence:"大きな理想を現実の形として築こうとする",impression:"落ち着きと重みのある",desire:"社会に残る確かなものを築きたいという思い",mission:"理想を仕組みや形にし、多くの人の役に立つ基盤をつくる",talent:"大きな構想を段階的に実現する",challenge:"責任を背負いすぎることや、完璧主義の傾向",workStyle:"長期的な構想をもとに、仕組みを整えながら着実に大きな成果を築くスタイルです。",relation:"誠実で頼れる存在として信頼を集めやすく、使命に没頭しすぎず身近な人との時間を大切にすることが鍵になります。",later:"築き上げた基盤を、社会や次世代に役立つ形で残すこと"}},33:{number:33,title:"無償の愛のマスターナンバー",keyword:"慈愛・癒やし・奉仕",basic:"33は「マスターティーチャー」とも呼ばれ、無条件の愛と癒やしを象徴するとされます。11と22の性質を高めた数と考えられ、基数6（愛情・責任）の性質を含みます。流派によっては33をマスターナンバーとして扱わない場合もあります。",nature:"人の痛みに深く共感し、損得を超えて手を差し伸べようとするタイプと読み取れます。独特の感性と包容力を持ち、型にはまらない自由な発想で周囲を驚かせることもあるでしょう。",strengths:["深い慈愛と共感力","人を癒やし安心させる存在感","型にとらわれない独創性","人の可能性を信じる力"],weaknesses:["人の問題を自分のことのように背負い込みやすい","自己犠牲が行き過ぎることがある","周囲から理解されにくい感覚を持つことがある","感情の振れ幅が大きくなりやすい"],talents:"人を癒やす力、教え導く力、多くの人の心に寄り添う力に恵まれやすい数です。",work:"人を癒やし育てる仕事、自由な発想を生かせる仕事で輝きやすいでしょう。奉仕の気持ちが強い分、自分の心身を守る仕組みを持つことが長く続ける秘訣です。",workExamples:["ヒーラー・セラピスト・カウンセラー","教育者・指導者","医療・福祉","芸術・表現活動"],love:"深い愛情で相手を包み込むタイプとされます。相手を救おうとするより、対等なパートナーとして支え合う関係を意識するとよいでしょう。",money:"損得にとらわれず与えることを優先しがちな傾向があります。自分の活動を守るためにも、受け取ることを自分に許すことが大切です。",lessons:"自分自身にも同じ愛を向けること。基数6の「身近な人を大切にする」感覚を土台にすることで、大きな愛が無理なく広がるとされます。",luck:["自分を癒やすセルフケアの時間を持つ","「できないこと」は断ってよいと自分に許可する","感謝の手紙を書く"],fragments:{essence:"深い慈愛で人を包み込もうとする",impression:"柔らかく独特な雰囲気をもつ",desire:"人の痛みを癒やし、無条件に愛したいという思い",mission:"人を癒やし、教え、可能性を開く",talent:"人の心に寄り添い癒やす",challenge:"人の問題を背負い込み、自己犠牲に傾きやすい傾向",workStyle:"人を癒やし育てることに喜びを見出し、自由な発想で関わるスタイルです。",relation:"深い愛情で人を包み込める一方、相手と自分の課題を分けて考えることが心の健康を保ちます。",later:"自分自身を満たしたうえで、その愛を多くの人に広げていくこと"}}};function O(e){return ju[e]??ju[(e-1)%9+1]}const Ke={1:{theme:"始まりと種まきの年",text:"新しい9年周期のスタートにあたる年とされます。これから育てたいことの種をまくのに適した時期で、新しい挑戦や環境の変化が起こりやすいでしょう。",advice:"「やってみたい」と感じたことに一歩踏み出してみましょう。始めることそのものに意味がある年です。"},2:{theme:"協力と育みの年",text:"前年にまいた種を、人との関わりの中でじっくり育てる年とされます。焦らず待つこと、協力し合うことがテーマになりやすいでしょう。",advice:"結果を急がず、人間関係や信頼づくりに時間をかけましょう。パートナーシップに縁がある時期です。"},3:{theme:"表現と広がりの年",text:"楽しさや創造性が高まり、交流や発信が広がりやすい年とされます。自分を表現することで新しい縁が生まれやすいでしょう。",advice:"好きなことを発信し、人と会う機会を増やしましょう。ただし予定の詰め込みすぎには注意を。"},4:{theme:"基盤づくりの年",text:"地道に努力し、土台を固める年とされます。成果がすぐ見えにくくても、ここで積み上げたことが後の安定につながると考えられます。",advice:"生活習慣・仕事の仕組み・お金の管理など、足元を整えることに力を注ぎましょう。"},5:{theme:"変化と自由の年",text:"9年周期の折り返しにあたり、変化や新しい体験が訪れやすい年とされます。環境や考え方が大きく動くこともあるでしょう。",advice:"変化を恐れず、柔軟に受け入れてみましょう。ただし勢いでの大きな決断は一度立ち止まって確認を。"},6:{theme:"愛と責任の年",text:"家族や身近な人との関係、責任ある役割がテーマになりやすい年とされます。人のために動くことで信頼が深まるでしょう。",advice:"大切な人との時間を優先しましょう。抱え込みすぎず、助けを求めることも忘れずに。"},7:{theme:"内省と学びの年",text:"立ち止まって自分を見つめ直し、学びを深める年とされます。外へ広げるよりも内側を充実させることに向いた時期です。",advice:"一人の時間を大切にし、学びや心身のメンテナンスに取り組みましょう。結論を急がなくて大丈夫です。"},8:{theme:"実りと達成の年",text:"これまでの努力が形になりやすく、仕事やお金の面で動きが出やすい年とされます。責任ある立場を任されることもあるでしょう。",advice:"目標を明確にして積極的に動きましょう。得た成果は、次の周期への投資としても活かしましょう。"},9:{theme:"完結と手放しの年",text:"9年周期の締めくくりにあたり、区切りや整理がテーマになる年とされます。役目を終えたものを手放すことで、次の始まりへの準備が整うと考えられます。",advice:"不要なもの・関係・習慣を見直し、感謝とともに手放しましょう。新しいことの本格始動は翌年がおすすめです。"}},Ul={1:"自立と挑戦の時期とされます。自分の力で道を選び、新しいことを始める経験を通して、自分らしさを確立していくテーマがあります。",2:"協力と調和の時期とされます。人との関わりやパートナーシップを通して学び、忍耐強く信頼を育てていくテーマがあります。",3:"表現と創造の時期とされます。自分の感性や言葉を生かし、交流や創作を楽しみながら才能を広げていくテーマがあります。",4:"基盤づくりの時期とされます。努力と継続によって、仕事・家庭・お金などの土台を固めていくテーマがあります。",5:"変化と経験の時期とされます。移動や転機、新しい出会いを通じて視野を広げ、自由の意味を学んでいくテーマがあります。",6:"愛と責任の時期とされます。家族や身近な人、共同体への責任を担い、人を育て支えることを通して成長するテーマがあります。",7:"探究と内省の時期とされます。学びや専門性を深め、精神的な成長や自分自身との対話を大切にするテーマがあります。",8:"達成と実現の時期とされます。社会的な成果や経済的な豊かさを形にし、力の使い方を学ぶテーマがあります。",9:"完成と奉仕の時期とされます。これまでの経験を統合し、広い視野で人や社会のために力を使うテーマがあります。",11:"直感と精神性が高まる時期とされます。ひらめきや気づきを人に伝え、精神的な成長を遂げていくテーマがあります（基数2の協調性も大切に）。",22:"大きなものを築く時期とされます。理想を現実の形にし、社会に役立つ基盤をつくるテーマがあります（基数4の地道さも大切に）。",33:"慈愛と奉仕の時期とされます。人を癒やし育てる役割を担い、無条件の愛を学ぶテーマがあります（基数6の身近な愛も大切に）。"},fo={0:"特定の課題が定まっていない「選択のチャレンジ」とされます。どの課題にも向き合える自由がある一方、自分で方向を選び取る主体性が求められます。",1:"自分の意見を持ち、主張することへの課題とされます。人に頼りすぎず、または強引になりすぎず、健全な自立を学ぶテーマです。",2:"感受性の強さとの付き合い方の課題とされます。人の言葉に傷つきやすい面を受け止め、自信を育てることがテーマです。",3:"自己表現への課題とされます。気持ちを言葉にする、人前で表現することへのためらいを越え、楽しむ心を育てることがテーマです。",4:"継続と秩序への課題とされます。面倒なことを後回しにせず、地道に積み上げる習慣を身につけることがテーマです。",5:"自由と節度のバランスの課題とされます。変化を恐れすぎず、または刺激に流されすぎず、適度な距離感を学ぶテーマです。",6:"責任と理想の課題とされます。完璧を求めすぎたり、人の世話を背負い込みすぎたりしないことがテーマです。",7:"信頼と心を開くことの課題とされます。疑いや孤独感にとらわれず、人や物事を信じる気持ちを育てることがテーマです。",8:"お金や力との付き合い方の課題とされます。物質的なものへの執着や不安から離れ、バランスのとれた価値観を育てることがテーマです。"},Yc={1:{name:"形成期",text:"人格の土台がつくられる時期。家庭や環境から受ける影響が大きいとされます。"},2:{name:"生産期",text:"社会の中で力を発揮し、才能を育てていく時期とされます。"},3:{name:"収穫期",text:"それまでの経験が実り、人生の集大成に向かう時期とされます。"}},Tt={13:{title:"カルミックデット 13（13/4）",text:"努力と継続に関わるテーマとされます。楽な道を選びたくなる気持ちや、途中で投げ出したくなる場面に向き合いやすいと解釈されます。",advice:"小さなことでも最後までやり遂げる経験を重ねることで、確かな実力と自信が育つとされます。"},14:{title:"カルミックデット 14（14/5）",text:"自由と節度に関わるテーマとされます。変化や刺激を求める気持ちが強く出やすく、生活のバランスを保つことが課題になりやすいと解釈されます。",advice:"自分なりのルールやリズムを持つことで、変化を味方につけながら安定も手にしやすくなります。"},16:{title:"カルミックデット 16（16/7）",text:"自我の再構築に関わるテーマとされます。思い込みやプライドが崩れるような出来事を通して、より深い気づきを得る経験をしやすいと解釈されます。",advice:"変化を「失うこと」ではなく「本当の自分に近づく過程」と捉えると、内面の強さが育つとされます。"},19:{title:"カルミックデット 19（19/1）",text:"自立と協力に関わるテーマとされます。一人で抱え込みすぎたり、人の助けを受け取りにくかったりする傾向に向き合いやすいと解釈されます。",advice:"自分の力を信じつつ、人と支え合うことも選べるようになると、本当の意味での自立に近づくとされます。"}},Gp={1:"自己主張や決断に苦手意識を持ちやすいとされます。小さな選択を自分で決める練習が助けになります。",2:"協調や忍耐、細やかな気配りが学びのテーマになりやすいとされます。相手のペースに合わせる経験が成長につながります。",3:"気持ちを表現することや、楽しむことへの苦手意識がテーマになりやすいとされます。日記や創作で表現の場を持つとよいでしょう。",4:"計画性や継続、整理整頓がテーマになりやすいとされます。小さな習慣を続けることで安定感が育ちます。",5:"変化への適応や新しい体験がテーマになりやすいとされます。少しずつ未知のことに触れることで視野が広がります。",6:"責任を担うことや、家族・身近な人との関わりがテーマになりやすいとされます。人の世話をする経験が学びになります。",7:"一人で深く考える時間や、物事を信じる力がテーマになりやすいとされます。静かに内省する時間を持つとよいでしょう。",8:"お金や力、自己評価との付き合い方がテーマになりやすいとされます。自分の価値を適切に認める練習が助けになります。",9:"広い視野や寛容さ、手放すことがテーマになりやすいとされます。立場の違う人の考えに触れる経験が成長につながります。"};function Xp(e,t){return`名前の中で「${e}」が最も多く現れています。${t}といった${e}の性質が、日常の行動や得意なことに強く表れやすいとされます。長所として生きる一方、過剰になると偏りとして出ることもあるため、バランスを意識するとよいでしょう。`}const Nu={1:"mind",5:"mind",7:"mind",2:"practical",4:"practical",8:"practical",3:"heart",6:"h
